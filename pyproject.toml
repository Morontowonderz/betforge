[project]
name = "betforge"
version = "0.1.0"
description = "Research prediction core for football Over1.5 goals and BTTS (Phase 01 scaffold, free/public data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ShadowSpark Technologies" }]
dependencies = []  # dependency-light: pure stdlib core; numpy/pandas optional at runtime

[project.optional-dependencies]
fast = ["numpy>=1.26", "pandas>=2.0"]
test = ["pytest>=7.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
betforge = "betforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betforge"]

[tool.hatch.build]
exclude = ["tests", "data", "dist", "docs", ".venv", ".git"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/betforge/models_engine.py", "src/betforge/backtest.py", "src/betforge/signals.py"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
